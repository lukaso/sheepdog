# The release constants (PHASE3.md D2, D4, §1.1). Sourced by POSIX sh; values only, no code.
# None of these is a secret: the team ID is in every signed binary, the identity hash is the hash
# of a public certificate.

# The designated requirement of a release build (§1.1). The exec door requires it of any file
# whose signature identifier, enclosing bundle ID or embedded Info.plist says the release ID.
SR_RELEASE_ID='com.lukaso.sheepr'
SR_RELEASE_REQUIREMENT='identifier "com.lukaso.sheepr" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] and certificate leaf[field.1.2.840.113635.100.6.1.13] and certificate leaf[subject.OU] = "P7UM972E39"'

# The Linux images, pinned by the multi-arch index digest (PHASE3.md D7), for the release build
# and every test leg. Resolved 2026-09-29; the image ids equal rust:1-alpine and rust:1-slim's.
SR_IMG_ALPINE='rust:1.98.1-alpine@sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f'
SR_IMG_SLIM='rust:1.98.1-slim@sha256:4cd829461bd5c4d511c32e269da9cb8929223b666519d8004e35fc8d1d771ab7'

# The signing identity, by the SHA-1 of its certificate (PHASE3.md D2; a public certificate's hash is
# not a secret; a renewed certificate makes the name ambiguous, never the hash). Read 2026-09-29 from
# `security find-identity -v -p codesigning`.
SR_SIGN_IDENTITY=7C2F2EBE3D6A6673DC2F12E670A4B77CB2C357C8

# The build counter (CFBundleVersion, PHASE3.md D4): the operator raises it by one and commits it
# before each tag; `release.sh check` refuses one not above the previous tag's.
SR_BUILD_COUNTER=1

# npm (PHASE3.md §5): the account that owns the four package names, and the names, the platform
# packages first and the main one last (publish-npm uploads in this order: the main one's optional
# dependencies name the others). publish checks npm's owners of these names before any GitHub call.
SR_NPM_USER=lukasco
SR_NPM_PKGS='sheepr-linux-arm64 sheepr-linux-x64 sheepr-darwin-universal sheepr'

# the notary keychain, relative to HOME (PHASE3.md D2 step 3): its own password, locked outside a build
SR_NOTARY_KEYCHAIN=Library/Keychains/sheepr-notary.keychain-db
